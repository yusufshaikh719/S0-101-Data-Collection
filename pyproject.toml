[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "so101-collector"
version = "0.1.0"
description = "Data collection pipeline for SO-101 floor pick-and-place demonstrations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "pyserial>=3.5",
    "opencv-python>=4.8",
    "PyYAML>=6.0",
    "lerobot[dataset]==0.6.1",
]

[project.optional-dependencies]
# Live Rerun viewer.
visualize = ["rerun-sdk>=0.18"]
dev = ["pytest>=7.4", "ruff>=0.4", "rerun-sdk>=0.18"]

[project.scripts]
so101-setup = "so101_collector.scripts.setup_rig:main"
so101-record = "so101_collector.scripts.record_episodes:main"
so101-check-cameras = "so101_collector.scripts.check_cameras:main"
so101-calibrate = "so101_collector.scripts.calibrate_joints:main"

[tool.hatch.build.targets.wheel]
packages = ["so101_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
